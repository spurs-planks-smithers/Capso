<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Review sampled recording</title><link rel="stylesheet" href="style.css"></head><body><main style="max-width:840px;margin:32px auto;padding:10px"><h1>Sampled recording</h1><p>Silent screenshots, at most one per second. Private fields and embedded frames are covered. Page changes can skip frames.</p><button id="pause">Pause</button><button id="resume">Resume</button><button id="stop">Stop and review</button><button id="discard">Discard recording</button><p id="status" role="status"></p><section id="selection" hidden><label>Start, seconds <input id="start" type="number" min="0" step="0.1"></label><label>End, seconds <input id="end" type="number" min="0" step="0.1"></label><label>Issue frame, seconds <input id="issue" type="number" min="0" step="0.1"></label><button id="select">Review selected evidence</button><p>Only the selected range enters the review draft. Add marks and notes there, then save or export.</p></section><h2>Observed timeline</h2><ol id="events"></ol></main><script type="module" src="recording-review.js"></script></body></html>
