<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nextshot feedback</title><link rel="stylesheet" href="style.css"></head>
<body class="review"><header><strong>Nextshot</strong><span id="page-title" class="muted">Browser feedback</span><span class="spacer"></span><button id="cancel">Cancel</button><button id="save" class="primary">Save and copy prompt</button></header>
<main class="workspace"><section class="evidence"><nav aria-label="Annotation tools"><button data-tool="dot" aria-pressed="true">Dot</button><button data-tool="arrow">Arrow</button><button data-tool="box">Box</button><span class="spacer"></span><button id="undo">Undo</button><button id="redo">Redo</button></nav><div class="canvas-area"><canvas id="canvas" aria-label="Feedback image. Click to add a numbered mark."></canvas></div><p id="hint" class="muted">Click to add your first numbered mark.</p></section>
<aside><label id="note-label" for="note">General note</label><textarea id="note" placeholder="What should change?"></textarea><div class="note-navigation"><button id="previous">Previous</button><button id="general">General note</button><button id="next">Next</button></div><section id="element-section"><h2>Page element</h2><p id="element-hint" class="muted">Element details follow your mark.</p><div id="elements"></div></section><p id="status" role="status" aria-live="polite"></p><div id="saved-actions" hidden><button id="copy">Copy prompt</button><button id="export">Export round</button></div></aside></main><script type="module" src="review.js"></script></body></html>
