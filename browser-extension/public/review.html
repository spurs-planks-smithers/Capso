<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nextshot feedback</title><link rel="stylesheet" href="style.css"></head>
<body class="review"><header><strong>Nextshot</strong><span id="page-title" class="muted">Browser feedback</span><span class="spacer"></span><button id="cancel">Cancel</button><button id="save" class="primary" title="Save feedback and copy the prompt">Done</button></header>
<main class="workspace"><section class="evidence"><nav aria-label="Annotation tools"><button data-tool="dot" aria-pressed="true">Dot</button><button data-tool="arrow">Arrow</button><button data-tool="box">Box</button><span class="spacer"></span><button id="undo">Undo</button><button id="redo">Redo</button></nav><div class="canvas-area"><canvas id="canvas" aria-label="Feedback image. Click to add a numbered mark."></canvas></div><p id="hint" class="muted">Click to add your first numbered mark.</p></section>
<aside><nav id="mark-tabs" aria-label="Your marks" hidden></nav><label id="note-label" for="note">General note (optional)</label><textarea id="note" placeholder="What should change?"></textarea><section id="target-question" hidden><p>Which part do you mean? <span class="muted">Optional</span></p><div id="target-choices"></div></section><details id="page-details"><summary>Page details</summary><section id="element-section"><p id="element-hint" class="muted"></p><div id="elements"></div><p class="muted privacy-note">Field contents stay hidden.</p></section></details><p id="status" role="status" aria-live="polite"></p><p id="delivery-status" class="muted" role="status"></p><div id="saved-actions" hidden><button id="copy">Copy prompt</button><button id="export">Export round</button></div></aside></main><script type="module" src="review.js"></script></body></html>
