<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Native annotation editor with notes</title><link rel="stylesheet" href="common.css"><script src="common.js"></script>
<style>.prev .lm{left:-60px;top:-290px}.blur{position:absolute;left:0;top:28px;width:1440px;height:828px;backdrop-filter:blur(9px);background:rgba(0,0,0,.2);z-index:15}</style></head><body>
<div class="desk" id="desk"></div>
<script>
const capture = `<div class="cap" style="left:170px;top:236px;width:710px;height:410px">${LEMON}
  <div class="mark" style="left:34px;top:224px;width:276px;height:76px"></div>
  ${badge(1, 486, 40)}${badge(2, 330, 226, true)}${badge(3, 126, 320)}</div>`;
const panel = `<div class="panel" style="left:900px;top:38px;width:520px">
  <div class="p-title"><div class="lights"><i></i><i></i><i></i></div><img class="ico" src="nextshot-24.png" alt=""><span>Capture: Lemonaid menu, 2026-10-30 09:41 PDT</span></div>
  <div class="p-body">
    <div class="tabs"><div class="tab"><span>1</span></div><div class="tab on"><span>2</span></div><div class="tab"><span>3</span></div><div class="tab">General <small>G</small></div></div>
    <div class="q">Circle 2 (2 of 3): what should change?</div>
    <div class="field">Make the price $12 a cup.</div>
    <div class="hint">Return saves and goes on. Shift+Return adds a line. Esc, then a number, picks a circle.</div>
    <div class="prev">${LEMON}
      <div class="mark" style="left:44px;top:44px;width:276px;height:76px"></div>
      ${badge(2, 340, 46, true)}${badge(3, 136, 140)}</div>
    <div class="chips"><span class="chip">Linked part: Text</span><span>Matched from the page when you placed the dot.</span><span class="link">Change</span></div>
  </div></div>`;
document.getElementById('desk').innerHTML = menubar() + chromeWindow() + '<div class="blur"></div>' + capture + panel +
  hud('Nextshot Dev: Add notes', [['Return', 'Save, go on'], ['Shift+Return', 'Add a line'], ['Esc, 1-9', 'Pick a circle'], ['⌘S', 'Save and copy']], { right: 12, bottom: 12 });
document.body.insertAdjacentHTML('beforeend', noteBar([
  '<b>Marks, notes, and the linked part stay aligned. Return on the last step saves and copies.</b>',
  'The outline is an editor aid and is never saved into the PNG. The inline toolbar is the existing one and is not redrawn.',
]));
</script></body></html>
