# Fork: production archive spec for scripts/release-notarized.sh.
# Despite the legacy name, this spec builds production Nextshot.
# On m5pro, never install or open its output. Local testing uses
# scripts/build-local.sh and scripts/dev-project.yml, including Release mode.
# Only the Capso target changes, so package targets keep their product names.
name: CapsoLocal

include:
  - project.yml

targets:
  Capso:
    # Nextshot's own app icon (Icon Composer). Only this build uses it, so the
    # upstream Capso.app keeps Capso's AppIcon. `type: file` keeps the .icon
    # folder as one reference, which actool compiles.
    sources:
      - path: Branding/Nextshot.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drewschulz.nextshot
        PRODUCT_NAME: Nextshot
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        ASSETCATALOG_COMPILER_APPICON_NAME: Nextshot
