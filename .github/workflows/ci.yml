name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Reset SwiftPM binary artifact caches
        run: |
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm/artifacts"
          find "$HOME/Library/Developer/Xcode/DerivedData" \
            -path '*/SourcePackages/artifacts' -prune -exec rm -rf {} + 2>/dev/null || true

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild -project Capso.xcodeproj \
            -scheme Capso \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test SharedKit
        run: swift test --package-path Packages/SharedKit

      - name: Test AnnotationKit
        run: swift test --package-path Packages/AnnotationKit

      - name: Test CaptureKit
        run: swift test --package-path Packages/CaptureKit

      - name: Test RecordingKit
        run: swift test --package-path Packages/RecordingKit

      - name: Test OCRKit
        run: swift test --package-path Packages/OCRKit

      - name: Test Capso app interactions
        run: |
          xcodebuild test -project Capso.xcodeproj \
            -scheme Capso \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:CapsoTests

  windows-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            windows:
              - 'Windows/**'
              - 'Packages/FeedbackKit/**'
              - '.github/workflows/ci.yml'

  windows:
    needs: windows-changes
    if: needs.windows-changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Test solution
        run: dotnet test Windows/Nextshot.sln

  windows-capture-smoke:
    needs: windows-changes
    if: needs.windows-changes.outputs.windows == 'true'
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: GDI CopyFromScreen smoke test
        run: dotnet run --project Windows/tools/CaptureSmoke -- "${{ github.workspace }}\capture-smoke.png"

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-smoke
          path: capture-smoke.png
          if-no-files-found: warn
