name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# GitHub disabled this fork's workflows from 2026-11-03 to 2026-11-06 for the scale of
# Actions usage. A new push to a pull request cancels that pull request's older run.
# A push to main never cancels a run, so every commit on main keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Reset SwiftPM binary artifact caches
        run: |
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm/artifacts"
          find "$HOME/Library/Developer/Xcode/DerivedData" \
            -path '*/SourcePackages/artifacts' -prune -exec rm -rf {} + 2>/dev/null || true

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild -project Capso.xcodeproj \
            -scheme Capso \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test SharedKit
        run: swift test --package-path Packages/SharedKit

      - name: Test AnnotationKit
        run: swift test --package-path Packages/AnnotationKit

      - name: Test CaptureKit
        run: swift test --package-path Packages/CaptureKit

      - name: Test RecordingKit
        run: swift test --package-path Packages/RecordingKit

      - name: Test OCRKit
        run: swift test --package-path Packages/OCRKit

      - name: Test Capso app interactions
        run: |
          xcodebuild test -project Capso.xcodeproj \
            -scheme Capso \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:CapsoTests

  # Picks the jobs to run. The macOS job reads only what project.yml and the package
  # manifests read, so it skips changes to site, docs, scripts, Windows, Branding, and
  # the root text files. Add a path to "app" when project.yml starts to read a new folder.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      windows: ${{ steps.filter.outputs.windows }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - 'App/**'
              - 'Packages/**'
              - 'project.yml'
              - 'THIRD_PARTY_NOTICES.md'
              - '.github/workflows/ci.yml'
            windows:
              - 'Windows/**'
              - 'Packages/FeedbackKit/**'
              - '.github/workflows/ci.yml'
            site:
              - 'site/**'
              - 'scripts/release.sh'
              - 'scripts/release-lib.sh'
              - 'scripts/release-markers.py'
              - '.github/workflows/ci.yml'

  # The release rehearsals are macOS-only: they drive scripts/release.sh, which
  # uses stat -f, security, and PlistBuddy. They are the only place a broken
  # release.sh is caught before Drew runs one, so they run here on a PR too.
  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the site and the release scripts
        run: node --test site/test/*.test.mjs

  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Test solution
        run: dotnet test Windows/Nextshot.sln

  windows-capture-smoke:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: GDI CopyFromScreen smoke test
        run: dotnet run --project Windows/tools/CaptureSmoke -- "${{ github.workspace }}\capture-smoke.png"

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-smoke
          path: capture-smoke.png
          if-no-files-found: warn
